<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTB Wildlife App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Google Fonts: Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SURVEY SELECTION SCREEN (shown on first load; hidden after selection)
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="surveySelection">
    <div class="selection-content">

      <!-- Fraxinus branding header -->
      <div class="frax-brand">
        <img src="img/fraxinus-logo-mark.jpg" class="frax-logo-mark" alt="" />
        <div class="frax-wordmark">
          <span class="frax-name">FRAXINUS</span>
          <span class="frax-tagline">Environmental &amp; Geomatics</span>
        </div>
      </div>

      <h1 class="selection-title">NTB Wildlife App</h1>
      <p class="selection-subtitle">Select a survey type to begin</p>

      <div class="survey-cards">
        <!-- Breeding Bird Survey -->
        <button class="survey-choice-btn" data-survey="BBS">
          <i class="fas fa-binoculars survey-card-icon"></i>
          <span class="survey-card-title">Breeding Bird Survey</span>
          <span class="survey-card-desc">
            Point-count methodology with species search, breeding codes,
            distance/bearing overlay and countdown timer.
          </span>
        </button>

        <!-- General Wildlife Survey -->
        <button class="survey-choice-btn" data-survey="MOOSE">
          <i class="fas fa-paw survey-card-icon"></i>
          <span class="survey-card-title">General Wildlife Survey</span>
          <span class="survey-card-desc">
            Use for Winter Tracking, PGI surveys, or general wildlife observations.
          </span>
        </button>

        <!-- Wood Turtle Survey -->
        <button class="survey-choice-btn" data-survey="TURTLE">
          <i class="fas fa-water survey-card-icon"></i>
          <span class="survey-card-title">Wood Turtle Survey</span>
          <span class="survey-card-desc">
            Individual turtle capture data, habitat observations, and
            riparian reach metadata for stream surveys.
          </span>
        </button>
      </div>

      <!-- Session lists (populated by main.js) -->
      <div id="draftsSection" style="display:none;" class="session-section">
        <h3 class="session-section-title"><i class="fas fa-pen-to-square"></i> Drafts</h3>
        <div id="draftsList"></div>
      </div>

      <div id="recentSection" class="session-section">
        <h3 class="session-section-title"><i class="fas fa-box-archive"></i> Survey Archive</h3>
        <div id="recentList"></div>
      </div>

      <p class="frax-footer-credit">Fraxinus Environmental &amp; Geomatics</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAP APP (hidden until survey selected)
  ════════════════════════════════════════════════════════════════════════ -->

  <!-- 1) Map container -->
  <div id="map" style="height:100vh; display:none;"></div>

  <!-- 2) Modal backdrop (shared) -->
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;"></div>

  <!-- 3) Survey Metadata modal (content injected by ui.js per survey type) -->
  <div id="surveyModal" class="modal" style="display:none;"></div>

  <!-- 4) BBS Species Observation modal -->
  <div id="speciesModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Add Species Observation</h2>
      <input type="text" id="speciesSearch" autocomplete="off" placeholder="Search for Species" />
      <ul id="speciesList" class="autocomplete-list"></ul>
      <label>Count:</label>
      <div class="count-controls">
        <button id="countMinus">−</button>
        <span id="speciesCountDisplay">1</span>
        <button id="countPlus">+</button>
      </div>
      <label for="breedingInput">Breeding Evidence:</label>
      <select id="breedingInput">
        <option value="">None</option>
        <option value="X">Observed (X)</option>
        <option value="H">Possible – Singing (H)</option>
        <option value="S">Possible – Territorial (S)</option>
        <option value="P">Probable – Pair (P)</option>
        <option value="T">Probable – Agitated (T)</option>
        <option value="C">Confirmed – Nest (C)</option>
      </select>
      <!-- BUG FIX #1: IDs changed from passHt/flightDir → passHtInput/flightDirInput -->
      <input type="text" id="passHtInput"    name="passHtInput"    placeholder="Flyover Pass Height" />
      <input type="text" id="flightDirInput" name="flightDirInput" placeholder="Flyover Direction" />
      <textarea id="noteInput" rows="2" placeholder="Optional notes..."></textarea>
      <div style="margin-top:10px;">
        <button id="speciesSaveButton">Save Observation</button>
        <button onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 5) Data Drawer (bottom sheet) -->
  <div id="dataDrawer" class="drawer" style="display:none;"></div>

  <!-- 6) Master buttons (top-left) -->
  <div id="masterButton" style="display:none;"></div>

  <!-- 7) Countdown HUD placeholder -->
  <div id="countdownHUD"></div>

  <!-- 8) BBS Timer Strip (hidden by default; shown for BBS only) -->
  <div id="survey-timer-strip" style="display:none;">
    <i class="fas fa-clock fa-2x" title="Survey Length (min)"></i>
    <input id="surveyLength" type="number" value="10" min="1" />
    <div id="timerDisplay">10:00</div>
    <button id="startTimerBtn" title="Start"><i class="fas fa-play"></i></button>
    <button id="pauseTimerBtn" title="Pause"><i class="fas fa-pause"></i></button>
    <button id="resetTimerBtn" title="Reset"><i class="fas fa-redo-alt"></i></button>
  </div>

  <!-- 9) Instructions Modal — content injected dynamically by modal.js -->
  <div id="instructionsModal"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Global species list (BBS) -->
  <script src="data/species_list.js"></script>
  <!-- App entry point -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
