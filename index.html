<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTB Wildlife App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6b2d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wildlife App" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Leaflet is only used by the standalone map adapter (js/map/leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>This app needs JavaScript enabled.</noscript>
  <script type="module">
    import { mount } from './js/app.js';
    mount(document.getElementById('app')).catch(err => {
      console.error(err);
      document.getElementById('app').innerHTML =
        '<p style="color:#fff;padding:24px;font-family:sans-serif">The app failed to start: ' +
        String(err.message || err).replace(/</g, '&lt;') + '</p>';
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
